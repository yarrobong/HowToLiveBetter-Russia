name: Russia adaptation check

on:
  push:
    branches:
      - main
      - 'russia-adaptation-wave-*'
      - full-russian-localization
  pull_request:
    paths:
      - 'README.md'
      - 'CLAUDE.md'
      - 'book/**'
      - 'docs/**'
      - 'index.html'
      - 'tools/check_russia_adaptation.py'
      - 'tools/test_check_russia_adaptation.py'
      - '.github/workflows/russia-adaptation-check.yml'

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Run unit tests
        run: python -m unittest tools.test_check_russia_adaptation -v

      - name: Run repository checker
        run: python tools/check_russia_adaptation.py
